name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Create google-services.json
      run: |
        cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "209356925669",
            "project_id": "gen-lang-client-0239324148",
            "storage_bucket": "gen-lang-client-0239324148.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:209356925669:android:db9621ce177256e6d6420c",
                "android_client_info": {
                  "package_name": "com.aistudio.poskilat.wzqk"
                }
              },
              "oauth_client": [
                {
                  "client_id": "209356925669-7007655tgifgdpv9s1hlmml60mbrkc6r.apps.googleusercontent.com",
                  "client_type": 1,
                  "android_info": {
                    "package_name": "com.aistudio.poskilat.wzqk",
                    "certificate_hash": "27c1e1f55def093de3630c72c147969acbaa5e94"
                  }
                },
                {
                  "client_id": "209356925669-2e2k2ql5k4tfrftkrvq5nmhdtnclfeua.apps.googleusercontent.com",
                  "client_type": 3
                }
              ],
              "api_key": [
                {
                  "current_key": "AIzaSyCNacs9Cu7TzbUQUc6wEGqXbltlJisoFZI"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": [
                    {
                      "client_id": "209356925669-2e2k2ql5k4tfrftkrvq5nmhdtnclfeua.apps.googleusercontent.com",
                      "client_type": 3
                    }
                  ]
                }
              }
            },
            {
              "client_info": {
                "mobilesdk_app_id": "1:209356925669:android:67e46eb6ef4a9802d6420c",
                "android_client_info": {
                  "package_name": "com.example.tenantpos"
                }
              },
              "oauth_client": [
                {
                  "client_id": "209356925669-01nac7l1k56hfcvkdog5a5m5f4elttjm.apps.googleusercontent.com",
                  "client_type": 1,
                  "android_info": {
                    "package_name": "com.example.tenantpos",
                    "certificate_hash": "da39a3ee5e6b4b0d3255bfef95601890afd80709"
                  }
                },
                {
                  "client_id": "209356925669-2e2k2ql5k4tfrftkrvq5nmhdtnclfeua.apps.googleusercontent.com",
                  "client_type": 3
                }
              ],
              "api_key": [
                {
                  "current_key": "AIzaSyCNacs9Cu7TzbUQUc6wEGqXbltlJisoFZI"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": [
                    {
                      "client_id": "209356925669-2e2k2ql5k4tfrftkrvq5nmhdtnclfeua.apps.googleusercontent.com",
                      "client_type": 3
